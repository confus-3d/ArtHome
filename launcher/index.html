<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>ArtHome</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="css/arthome.css">
</head>
<body>
  <!-- Fondo: la obra del Modo Arte, difuminada (js/arte.js). -->
  <canvas id="fondo" class="fondo" width="96" height="54"></canvas>
  <div id="velo" class="velo"></div>

  <!-- Inicio (Galería) -->
  <section id="inicio" class="pantalla">
    <div id="hora" class="hora"></div>
    <div id="fecha" class="fecha"></div>
    <div class="linea-estado"><span id="tiempo"></span><svg id="network" class="red" viewBox="0 0 24 24"></svg></div>
    <div id="cartela" class="cartela" hidden>
      <div id="cartela-titulo" class="cartela-titulo"></div>
      <div id="cartela-autor" class="cartela-autor"></div>
    </div>
    <div id="dock" class="dock"></div>
    <div id="barra" class="barra"></div>
  </section>

  <!-- Todas las apps (catálogo) -->
  <section id="catalogo" class="pantalla" hidden>
    <div class="cabecera">
      <h1>Todas las apps</h1>
      <span id="cuenta" class="cuenta"></span>
      <span id="conmutar" class="conmutar">Ver las escondidas</span>
      <span class="hora-pequena"></span>
    </div>
    <div class="leyenda"><b>◆ 1</b> está en tu inicio, en esa posición</div>
    <div id="columnas" class="columnas"></div>
    <div class="ficha">
      <div id="caratula" class="caratula"></div>
      <h3 id="ficha-nombre"></h3>
      <div id="ficha-estado" class="estado"></div>
      <input id="campo-nombre" class="campo" type="text" maxlength="24" autocomplete="off" hidden>
      <div id="acciones" class="acciones"></div>
      <div id="pista" class="pista">Pulsa OK para ver las opciones</div>
    </div>
  </section>

  <!-- Ajustes -->
  <section id="ajustes" class="pantalla" hidden>
    <div class="cabecera"><h1>Ajustes</h1><span class="hora-pequena"></span></div>
    <div id="secciones" class="secciones"></div>
    <div class="marco-panel"><div id="panel" class="panel"></div></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/app-catalog.js"></script>
  <script src="js/app-lookup.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/preferencias.js"></script>
  <script src="js/obras.js"></script>
  <script src="js/tienda.js"></script>
  <script src="js/artwork.js"></script>
  <script src="js/homewatch.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/entradas.js"></script>
  <script src="js/network.js"></script>
  <script src="js/cabecera.js"></script>
  <script src="js/arte.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
